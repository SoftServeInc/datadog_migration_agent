# Drives the OpenTelemetry Demo's AI agent on a loop so GenAI spans keep flowing.
#
# The agent runs with USE_VCR=True (upstream default), replaying recorded LLM
# responses, so this costs nothing and needs no model credentials. The three
# prompts below are the ones the upstream cassettes cover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-load-generator
  labels:
    app.kubernetes.io/name: ai-load-generator
    app.kubernetes.io/part-of: otel-demo-multibackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-load-generator
        app.kubernetes.io/part-of: otel-demo-multibackend
    spec:
      containers:
        - name: driver
          image: curlimages/curl:8.11.1
          env:
            - name: AGENT_URL
              value: "http://agent:8010/prompt"
            - name: INTERVAL
              value: "__AI_LOAD_INTERVAL__"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              i=0
              prompt_for() {
                case "$1" in
                  0) echo "Show all available products in the store." ;;
                  1) echo "What currencies are supported by the Astronomy Shop?" ;;
                  *) echo "What current promotions are available on binoculars?" ;;
                esac
              }
              echo "ai-load-generator: target=${AGENT_URL} interval=${INTERVAL}s"
              while true; do
                msg=$(prompt_for "$i")
                printf '{"message":"%s","history":[]}\n' "$msg" > /tmp/body.json
                curl -sS -m 180 -o /dev/null \
                     -w "prompt=$i status=%{http_code} time=%{time_total}s\n" \
                     -X POST "$AGENT_URL" \
                     -H 'Content-Type: application/json' \
                     --data @/tmp/body.json || echo "prompt=$i request failed"
                i=$(( (i + 1) % 3 ))
                sleep "$INTERVAL"
              done
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # curlimages/curl declares USER as a name ("curl_user"), and the
            # kubelet cannot prove a named user is non-root — it fails the pod
            # with CreateContainerConfigError. Numeric IDs are required
            # alongside runAsNonRoot. These are curl_user/curl_group.
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # The prompt body is written here, so the root filesystem stays read-only.
        - name: tmp
          emptyDir: {}
